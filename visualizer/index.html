<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DJ Visualizer (WebGPU)</title>
    <style>
      body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
      canvas { width: 100vw; height: 100vh; display: block; }
      #ui {
        position: absolute; top: 10px; left: 10px;
        background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px;
        pointer-events: auto;
      }
      #status { margin-bottom: 10px; font-size: 12px; font-family: monospace; }
      input { background: #333; color: #fff; border: 1px solid #555; padding: 5px; width: 200px; }
      button { background: #444; color: #fff; border: 1px solid #555; padding: 5px 10px; cursor: pointer; }
      button:hover { background: #666; }
      .bar-container { width: 100%; height: 10px; background: #222; margin-top: 5px; }
      #energy-bar { width: 0%; height: 100%; background: #0f0; transition: width 0.05s; }
      .beat-indicator { width: 20px; height: 20px; border-radius: 50%; background: #444; display: inline-block; vertical-align: middle; margin-left: 10px; }
      .beat-active { background: #f00; box-shadow: 0 0 10px #f00; }
    </style>
  </head>
  <body>
    <div id="ui">
      <h3>DJ Visualizer Control</h3>
      <div id="status">Connecting...</div>

      <div>
        <label>Energy:</label>
        <div class="bar-container"><div id="energy-bar"></div></div>
      </div>
      <div style="margin-top: 10px;">
        <label>Beat:</label>
        <div id="beat-indicator" class="beat-indicator"></div>
      </div>

      <div style="margin-top: 20px;">
        <input type="text" id="prompt-input" placeholder="Enter visual style (e.g. 'fire')..." />
        <button id="generate-btn">Generate</button>
      </div>
    </div>
    <canvas id="visualizer-canvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
